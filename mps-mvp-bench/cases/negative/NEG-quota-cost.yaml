# 由 tools/gen_cases.py 生成，可手工微调；字段含义见 docs/CONFIG.zh-CN.md
case:
  id: NEG-quota-cost
  family: negative
  mode: mps_concurrent
  description: 配额成本：一方活跃、一方低负载；50% 上限是否限制活跃方使用闲置能力。相对整卡变慢应标记为配额成本，而不是 MPS 本身退化
  reference:
  - B0
  - B2
clients:
  a:
    role: high
    workload: image_inference
    mode: offline
    model:
      name: resnet50
      input_size: 224
      precision: fp16
      batch_size: 64
      input_pool_size: 32
      cpu_threads: 4
    load:
      arrival: closed_loop
      target_qps: null
      concurrency: 4
      queue_limit: 64
    mps:
      active_thread_percentage: 50
      priority: NORMAL
  b:
    role: low
    workload: image_inference
    mode: online
    model:
      name: resnet18
      input_size: 224
      precision: fp16
      batch_size: 8
      input_pool_size: 64
      cpu_threads: 4
    load:
      arrival: poisson
      target_qps: 2.0
      concurrency: 32
      queue_limit: 512
    mps:
      active_thread_percentage: 50
      priority: NORMAL
