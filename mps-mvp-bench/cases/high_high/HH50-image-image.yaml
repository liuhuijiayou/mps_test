# 由 tools/gen_cases.py 生成，可手工微调；字段含义见 docs/CONFIG.zh-CN.md
case:
  id: HH50
  family: high_high
  mode: mps_concurrent
  description: 高优+高优，SM 不隔离，执行资源上限各 50%，显存各 50% 上限（图像+图像）
  reference:
  - B0
  - B2
clients:
  a:
    role: high
    workload: image_inference
    mode: online
    model:
      name: resnet18
      input_size: 224
      precision: fp16
      batch_size: 8
      input_pool_size: 64
      cpu_threads: 4
    load:
      arrival: poisson
      target_qps: 120.0
      concurrency: 32
      queue_limit: 512
    mps:
      active_thread_percentage: 50
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
  b:
    role: high
    workload: image_inference
    mode: offline
    model:
      name: resnet50
      input_size: 224
      precision: fp16
      batch_size: 64
      input_pool_size: 32
      cpu_threads: 4
    load:
      arrival: closed_loop
      target_qps: null
      concurrency: 4
      queue_limit: 64
    mps:
      active_thread_percentage: 50
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
