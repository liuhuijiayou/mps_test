# 由 tools/gen_cases.py 生成，可手工微调；字段含义见 docs/CONFIG.zh-CN.md
case:
  id: MEM-HH-50
  family: memory
  mode: mps_concurrent
  description: 高高各 50% 显存上限：分别触达配额边界，一方超额时另一方继续真实推理并做正确性检查
  reference:
  - B0
  - B2
  expect:
    client_a_quota_oom: true
    client_b_quota_oom: true
    peer_correctness: true
clients:
  a:
    role: high
    workload: image_inference
    mode: online
    model: &id001
      name: resnet18
      input_size: 224
      precision: fp16
      batch_size: 8
      input_pool_size: 64
      cpu_threads: 4
    load: &id002
      arrival: poisson
      target_qps: 120.0
      concurrency: 32
      queue_limit: 512
    mps:
      active_thread_percentage: 100
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
  b:
    role: high
    workload: image_inference
    mode: online
    model: *id001
    load: *id002
    mps:
      active_thread_percentage: 100
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
