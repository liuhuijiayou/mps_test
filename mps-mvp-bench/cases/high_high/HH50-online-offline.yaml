# 由 tools/gen_cases.py 生成，可手工微调；字段含义见 docs/CONFIG.zh-CN.md
case:
  id: HH50
  family: high_high
  mode: mps_concurrent
  description: 高优+高优，各 50%，在线小 batch + 离线大 batch（异构，吞吐不合计）
  reference:
  - B0
  - B2
clients:
  a:
    role: high
    workload: image_inference
    mode: online
    model:
      name: resnet18
      input_size: 224
      precision: fp16
      batch_size: 8
      input_pool_size: 64
      cpu_threads: 4
    load:
      arrival: poisson
      target_qps: 120.0
      concurrency: 32
      queue_limit: 512
    mps:
      active_thread_percentage: 50
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
  b:
    role: high
    workload: recsys_scoring
    mode: offline
    model:
      precision: fp16
      batch_size: 4096
      input_pool_size: 16
      cpu_threads: 4
    recsys:
      num_tables: 24
      rows_per_table: 800000
      embedding_dim: 128
      indices_per_sample: 48
      dense_features: 256
      bottom_mlp:
      - 1024
      - 512
      - 128
      top_mlp:
      - 1024
      - 512
      - 1
      index_distribution: zipf
      zipf_s: 1.0
      working_set_rows: 800000
    load:
      arrival: closed_loop
      target_qps: null
      concurrency: 4
      queue_limit: 32
    mps:
      active_thread_percentage: 50
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
