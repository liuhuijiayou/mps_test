# 由 tools/gen_cases.py 生成，可手工微调；字段含义见 docs/CONFIG.zh-CN.md
case:
  id: NEG-compute
  family: negative
  mode: mps_concurrent
  description: 计算争用：两个大 batch 图像推理，看单任务尾延迟是否变差、合计吞吐是否收益不足/退化
  reference:
  - B0
  - B2
  sweep:
  - name: batch128
    set:
      clients.a.model.batch_size: 128
      clients.b.model.batch_size: 128
  - name: batch256
    set:
      clients.a.model.batch_size: 256
      clients.b.model.batch_size: 256
clients:
  a:
    role: high
    workload: image_inference
    mode: offline
    model: &id001
      name: resnet50
      input_size: 224
      precision: fp16
      batch_size: 64
      input_pool_size: 32
      cpu_threads: 4
    load: &id002
      arrival: closed_loop
      target_qps: null
      concurrency: 4
      queue_limit: 64
    mps:
      active_thread_percentage: 100
      priority: NORMAL
  b:
    role: high
    workload: image_inference
    mode: offline
    model: *id001
    load: *id002
    mps:
      active_thread_percentage: 100
      priority: NORMAL
