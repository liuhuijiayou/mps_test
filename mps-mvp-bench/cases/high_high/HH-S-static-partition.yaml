# 由 tools/gen_cases.py 生成，可手工微调；字段含义见 docs/CONFIG.zh-CN.md
case:
  id: HH-S
  family: high_high
  mode: mps_concurrent
  description: 高优+高优，静态 SM 分区各约 50% 不重叠物理 SM。能力不支持则 SKIP，禁止用 ACTIVE_THREAD_PERCENTAGE/亲和性/MIG
    冒充
  reference:
  - B0
  - B2
clients:
  a:
    role: high
    workload: image_inference
    mode: online
    model:
      name: resnet18
      input_size: 224
      precision: fp16
      batch_size: 8
      input_pool_size: 64
      cpu_threads: 4
    load:
      arrival: poisson
      target_qps: 120.0
      concurrency: 32
      queue_limit: 512
    mps:
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
      static_partition: partA
  b:
    role: high
    workload: image_inference
    mode: offline
    model:
      name: resnet50
      input_size: 224
      precision: fp16
      batch_size: 64
      input_pool_size: 32
      cpu_threads: 4
    load:
      arrival: closed_loop
      target_qps: null
      concurrency: 4
      queue_limit: 64
    mps:
      priority: NORMAL
      pinned_device_mem_limit_fraction: 0.5
      static_partition: partB
mps:
  static_partitioning:
    enabled: true
    partitions:
    - name: partA
      sm_count: 28
    - name: partB
      sm_count: 28
