# 由 tools/gen_cases.py 生成，可手工微调；字段含义见 docs/CONFIG.zh-CN.md
case:
  id: NEG-high-low
  family: negative
  mode: mps_concurrent
  description: 高低干扰：高优在线小 batch + 低优饱和大 batch；对比无保护/仅优先级/仅上限/组合
  reference:
  - B0
  - B2
  sweep:
  - name: prio-only
    set:
      clients.b.mps.priority: BELOW_NORMAL
  - name: cap-only
    set:
      clients.b.mps.active_thread_percentage: 50
  - name: combined
    set:
      clients.b.mps.priority: BELOW_NORMAL
      clients.b.mps.active_thread_percentage: 50
  - name: qps240
    set:
      clients.a.load.target_qps: 240.0
clients:
  a:
    role: high
    workload: image_inference
    mode: online
    model:
      name: resnet18
      input_size: 224
      precision: fp16
      batch_size: 8
      input_pool_size: 64
      cpu_threads: 4
    load:
      arrival: poisson
      target_qps: 120.0
      concurrency: 32
      queue_limit: 512
    mps:
      active_thread_percentage: 100
      priority: NORMAL
  b:
    role: low
    workload: image_inference
    mode: offline
    model:
      name: resnet50
      input_size: 224
      precision: fp16
      batch_size: 64
      input_pool_size: 32
      cpu_threads: 4
    load:
      arrival: closed_loop
      target_qps: null
      concurrency: 4
      queue_limit: 64
    mps:
      active_thread_percentage: 100
      priority: NORMAL
